name: Deploy (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JPASTA_OWNER_PIN: ${{ secrets.JPASTA_OWNER_PIN }}
      AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
      REALTIME_SECRET: ${{ secrets.REALTIME_SECRET }}
      PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=critical

      # Tests are destructive (TRUNCATE orders). They run in CI against a
      # disposable service container — never here against production. This
      # job trusts a green CI run on the same ref.
      - name: Verify
        run: |
          npm run format:check
          npm run lint
          npm run check:contrast
          npm run typecheck

      - name: Back up production database
        env:
          JPASTA_BACKUP_MODE: remote
        run: npm run db:backup

      - name: Upload database backup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup
          path: backups/
          retention-days: 7

      - name: Migrate production database
        run: npm run db:migrate

      - name: Provision owner/settings (no catalog reset)
        run: npm run db:seed -- --provision

      - name: Deploy
        run: npm run deploy

      - name: Post-deploy smoke
        run: |
          set -euo pipefail
          BASE="${{ secrets.NEXT_PUBLIC_SITE_URL }}"
          for path in / /menu /robots.txt /.well-known/security.txt; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$path")
            echo "$path -> $status"
            test "$status" = "200"
          done
          curl -sS --max-time 20 "$BASE/api/health" | grep -q '"ok":true'
          curl -sSI --max-time 20 "$BASE/" | tr -d '\r' | grep -qi '^content-security-policy:'
          curl -sSI --max-time 20 "$BASE/" | tr -d '\r' | grep -qi '^x-frame-options: DENY'
