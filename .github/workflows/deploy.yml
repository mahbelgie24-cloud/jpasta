name: Deploy (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JPASTA_OWNER_PIN: ${{ secrets.JPASTA_OWNER_PIN }}
      AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
      REALTIME_SECRET: ${{ secrets.REALTIME_SECRET }}
      PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test

      - name: Migrate production database
        run: npm run db:migrate

      - name: Provision owner/settings (no catalog reset)
        run: npm run db:seed -- --provision

      - name: Deploy
        run: npm run deploy

      - name: Post-deploy health
        run: |
          curl --fail --retry 5 --retry-delay 3 "${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/health"
