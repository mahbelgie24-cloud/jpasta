name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jpasta
          POSTGRES_PASSWORD: jpasta
          POSTGRES_DB: jpasta
        ports: ["54330:5432"]
        options: >-
          --health-cmd "pg_isready -U jpasta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://jpasta:jpasta@127.0.0.1:54330/jpasta
      JPASTA_OWNER_PIN: "135790"
      AUTH_PEPPER: ci-pepper-not-a-production-secret
      REALTIME_SECRET: ci-realtime-not-a-production-secret
      NEXT_PUBLIC_SITE_URL: https://jpasta.example
      NEXT_PUBLIC_WHATSAPP_NUMBER: "970566064976"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Contrast
        run: npm run check:contrast

      - name: Types
        run: npm run typecheck

      - name: Migrate + seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Tests
        run: npm test

      - name: Next build
        run: npm run build

      - name: OpenNext worker bundle
        run: npm run build:cf

      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir=.wrangler/ci
