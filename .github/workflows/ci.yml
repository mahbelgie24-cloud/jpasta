name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jpasta
          POSTGRES_PASSWORD: jpasta
          POSTGRES_DB: jpasta
        ports: ["54330:5432"]
        options: >-
          --health-cmd "pg_isready -U jpasta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://jpasta:jpasta@127.0.0.1:54330/jpasta
      TEST_DATABASE_URL: postgres://jpasta:jpasta@127.0.0.1:54330/jpasta
      JPASTA_OWNER_PIN: "135790"
      AUTH_PEPPER: ci-pepper-not-a-production-secret
      REALTIME_SECRET: ci-realtime-not-a-production-secret
      PII_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SITE_URL: https://jpasta.example
      NEXT_PUBLIC_WHATSAPP_NUMBER: "970566064976"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Contrast
        run: npm run check:contrast

      - name: Types
        run: npm run typecheck

      # The host guard must refuse a destructive reset before connecting.
      - name: Destructive seed guard
        run: |
          set +e
          DATABASE_URL=postgres://user:pass@db.example.com/prod npm run db:seed -- --force
          code=$?
          set -e
          test "$code" -eq 1

      - name: Migrate + seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Tests
        run: npm test

      - name: Next build
        run: npm run build

      - name: OpenNext worker bundle
        run: npm run build:cf

      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir=.wrangler/ci

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jpasta
          POSTGRES_PASSWORD: jpasta
          POSTGRES_DB: jpasta
        ports: ["54330:5432"]
        options: >-
          --health-cmd "pg_isready -U jpasta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://jpasta:jpasta@127.0.0.1:54330/jpasta
      TEST_DATABASE_URL: postgres://jpasta:jpasta@127.0.0.1:54330/jpasta
      JPASTA_OWNER_PIN: "135790"
      AUTH_PEPPER: ci-pepper-not-a-production-secret
      REALTIME_SECRET: ci-realtime-not-a-production-secret
      PII_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SITE_URL: https://jpasta.example
      NEXT_PUBLIC_WHATSAPP_NUMBER: "970566064976"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrate + seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # `webServer` boots `next start -p 3220`; reuseExistingServer is off in CI.
      # The visual baselines in e2e/visual.spec.ts-snapshots/ must be committed.
      - name: Journeys + axe + visual
        run: npx playwright test

      - name: Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jpasta
          POSTGRES_PASSWORD: jpasta
          POSTGRES_DB: jpasta
        ports: ["54330:5432"]
        options: >-
          --health-cmd "pg_isready -U jpasta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://jpasta:jpasta@127.0.0.1:54330/jpasta
      TEST_DATABASE_URL: postgres://jpasta:jpasta@127.0.0.1:54330/jpasta
      JPASTA_OWNER_PIN: "135790"
      AUTH_PEPPER: ci-pepper-not-a-production-secret
      REALTIME_SECRET: ci-realtime-not-a-production-secret
      PII_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SITE_URL: https://jpasta.example
      NEXT_PUBLIC_WHATSAPP_NUMBER: "970566064976"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrate + seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Build
        run: npm run build

      # Two honest budgets:
      #  - mobile (default Lighthouse profile) hard gates: LCP < 4.5s,
      #    CLS < 0.05, JS < 300KB, fonts < 250KB. The performance score and
      #    TBT are warnings — the mobile lab score is React-hydration-bound.
      #  - desktop proves the code itself is lean: perf ≥ 0.95, LCP < 1.5s,
      #    CLS < 0.02, TBT < 200ms.
      # Chrome is preinstalled on GitHub runners; locally set CHROME_PATH.
      - name: Lighthouse mobile budgets
        run: npm run test:lighthouse

      - name: Lighthouse desktop budgets
        run: npm run test:lighthouse:desktop

      - name: Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
