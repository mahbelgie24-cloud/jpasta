<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JPasta — لا يوجد اتصال</title>
    <style>
      :root {
        color-scheme: light;
        --basil-800: #1b4831;
        --basil-700: #235c3e;
        --basil-950: #0c2419;
        --cream-50: #fdfbf7;
        --cream-100: #f9f5ec;
        --cream-300: #e7ddc8;
        --wheat-300: #e3c98f;
        --ink: #182620;
        --ink-soft: #4a5a51;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            60% 50% at 80% 10%,
            rgba(227, 201, 143, 0.18),
            transparent 65%
          ),
          var(--basil-950);
        color: var(--cream-50);
        font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        border: 1px solid rgba(249, 245, 236, 0.14);
        border-radius: 28px;
        padding: 32px 28px;
        background: rgba(249, 245, 236, 0.04);
        text-align: center;
        backdrop-filter: blur(12px);
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto;
        border-radius: 18px;
        background: var(--basil-700);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 22px;
        color: var(--cream-50);
        letter-spacing: -1px;
      }
      h1 {
        margin: 22px 0 8px;
        font-size: 26px;
      }
      p {
        margin: 0;
        color: rgba(249, 245, 236, 0.7);
        line-height: 1.8;
        font-size: 15px;
      }
      .actions {
        display: grid;
        gap: 10px;
        margin-top: 24px;
      }
      a,
      button {
        min-height: 48px;
        border-radius: 999px;
        border: 0;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }
      .primary {
        background: var(--wheat-300);
        color: var(--basil-950);
      }
      .secondary {
        background: transparent;
        color: var(--cream-50);
        border: 1px solid rgba(249, 245, 236, 0.22);
      }
      .hint {
        margin-top: 18px;
        font-size: 12px;
        color: rgba(249, 245, 236, 0.45);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">JP</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        طلبك السابق محفوظ ولن يضيع. عند عودة الاتصال سنرسله تلقائياً — وبنفس
        الرقم، بدون تكرار.
      </p>
      <div class="actions">
        <button class="primary" onclick="location.reload()">
          إعادة المحاولة
        </button>
        <a class="secondary" href="/menu">تصفّح القائمة</a>
      </div>
      <p class="hint">JPasta — باستا طازة تُطبخ عند الطلب، قلقيلية</p>
    </main>
  </body>
</html>
